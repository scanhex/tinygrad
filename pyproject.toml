[project]
name = "tinygrad"
version = "0.9.4"
description="You like pytorch? You like micrograd? You love tinygrad! <3"
authors = [{name = "George Hotz"}]
requires-python = ">=3.8,<3.12"

# only needed for testing actually
dependencies = [
    "torch==2.5.1",
    "pillow",
    "pytest",
    "pytest-xdist",
    "onnx==1.16.0",
    "onnx2torch",
    "opencv-python",
    "tabulate",
    "safetensors",
    "transformers",
    "sentencepiece",
    "tiktoken",
    "librosa",
    "networkx",
    "hypothesis",
    "nibabel",
    "pydot",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "platform_system != 'Darwin'"}
torchvision = { index = "pytorch-cpu", marker = "platform_system != 'Darwin'"}
torchaudio = { index = "pytorch-cpu", marker = "platform_system != 'Darwin'"}

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = [
    "tests",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

